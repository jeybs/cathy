<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PlugIt Privacy Policy</title>

  <meta
    name="description"
    content="Privacy Policy for PlugIt, a macOS application."
  />

  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      line-height: 1.7;
      background: #f7f7f9;
      color: #1d1d1f;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 48px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 40px;
      line-height: 1.2;
    }

    h2 {
      margin-top: 36px;
      margin-bottom: 12px;
      font-size: 22px;
    }

    p,
    li {
      font-size: 16px;
    }

    .effective-date {
      color: #6e6e73;
      margin-bottom: 32px;
    }

    a {
      color: #0066cc;
    }

    footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #e5e5e7;
      color: #6e6e73;
      font-size: 14px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0d0d0f;
        color: #f5f5f7;
      }

      .card {
        background: #1c1c1e;
        box-shadow: none;
      }

      .effective-date,
      footer {
        color: #a1a1a6;
      }

      footer {
        border-color: #38383a;
      }

      a {
        color: #2997ff;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 24px 16px;
      }

      .card {
        padding: 28px 22px;
        border-radius: 16px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <article class="card">
      <p>CATHY APP</p>

      <footer>
        &copy; 2026 PlugIt / J Labs Tech. All rights reserved.
      </footer>
    </article>
  </main>
</body>
</html>
